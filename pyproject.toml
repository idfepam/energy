[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-collect"
version = "0.1.0"
description = "Data collection framework for European energy infrastructure dependency mapping"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-entsoe>=0.6.1",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "typer>=0.9",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "openpyxl>=3.1",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
report = ["matplotlib>=3.8", "geopandas>=1.0", "contextily>=1.6", "fpdf2>=2.7", "pillow>=10.0"]

[project.scripts]
energy-collect = "energy_collect.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
